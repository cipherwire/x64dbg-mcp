name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-plugin:
    name: Build Native Plugin (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download x64dbg SDK
        shell: powershell
        run: |
          Write-Host "Downloading x64dbg 2026 snapshot SDK..."
          $sdkUrl = "https://github.com/x64dbg/x64dbg/releases/download/2026.05.27/snapshot_2026-05-27_12-11.zip"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "x64dbg_snapshot.zip"
          Write-Host "Extracting x64dbg SDK..."
          Expand-Archive -Path "x64dbg_snapshot.zip" -DestinationPath "$env:RUNNER_TEMP\x64dbg"
          $sdkPath = "$env:RUNNER_TEMP\x64dbg\pluginsdk"
          if (-not (Test-Path $sdkPath)) {
            Write-Error "SDK directory not found at $sdkPath"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "X64DBG_SDK_DIR=$sdkPath"
          Write-Host "SDK located at $sdkPath"

      - name: Compile Plugin with MSVC (/W4 /WX)
        shell: powershell
        run: |
          .\scripts\build.ps1 -SdkDir $env:X64DBG_SDK_DIR

      - name: Verify Plugin Binary
        shell: powershell
        run: |
          $plugin = "bin\x64dbg_mcp.dp64"
          if (-not (Test-Path $plugin)) {
            Write-Error "Expected plugin binary was not produced: $plugin"
            exit 1
          }
          $item = Get-Item $plugin
          Write-Host "Build verification passed: $plugin ($($item.Length) bytes)"

      - name: Upload Native Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg_mcp.dp64
          path: bin/x64dbg_mcp.dp64
          if-no-files-found: error

  test-python:
    name: Python Package & Syntax Verification
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Server Module Syntax and Tool Count
        shell: powershell
        run: |
          python -c @'
          import ast
          with open('mcp_server/server.py', 'r', encoding='utf-8') as f:
              tree = ast.parse(f.read())
          tools = [
              n.name for n in ast.walk(tree)
              if isinstance(n, ast.FunctionDef)
              and any(isinstance(d, ast.Call) and getattr(d.func, 'attr', '') == 'tool' for d in n.decorator_list)
          ]
          print(f"Discovered {len(tools)} tools in server.py")
          assert len(tools) == 234, f"Expected 234 tools, found {len(tools)}"
          print("Tool surface validation successful.")
          '@

      - name: Build Python Distribution Packages
        shell: powershell
        run: |
          python -m build
          Get-ChildItem dist\
