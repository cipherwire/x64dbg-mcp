name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-plugin:
    name: Build Native Plugin (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download x64dbg SDK
        shell: powershell
        run: |
          Write-Host "Fetching latest x64dbg release information..."
          $headers = @{ "User-Agent" = "GitHubActions-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/x64dbg/x64dbg/releases/tags/snapshot" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "snapshot_*.zip" -and $_.name -notlike "symbols-*" } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Failed to locate x64dbg snapshot zip in release assets."
            exit 1
          }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "x64dbg_snapshot.zip"
          Write-Host "Extracting x64dbg SDK..."
          Expand-Archive -Path "x64dbg_snapshot.zip" -DestinationPath "$env:RUNNER_TEMP\x64dbg"
          $sdkPath = "$env:RUNNER_TEMP\x64dbg\pluginsdk"
          if (-not (Test-Path $sdkPath)) {
            Write-Error "SDK directory not found at $sdkPath"
            exit 1
          }
          echo "X64DBG_SDK_DIR=$sdkPath" >> $env:GITHUB_ENV
          Write-Host "SDK located at $sdkPath"

      - name: Compile Plugin with MSVC (/W4 /WX)
        shell: powershell
        run: |
          .\scripts\build.ps1 -SdkDir $env:X64DBG_SDK_DIR

      - name: Verify Plugin Binary
        shell: powershell
        run: |
          $plugin = "bin\x64dbg_mcp.dp64"
          if (-not (Test-Path $plugin)) {
            Write-Error "Expected plugin binary was not produced: $plugin"
            exit 1
          }
          $item = Get-Item $plugin
          Write-Host "Build verification passed: $plugin ($($item.Length) bytes)"

      - name: Upload Native Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg_mcp.dp64
          path: bin/x64dbg_mcp.dp64
          if-no-files-found: error

  test-python:
    name: Python Package & Syntax Verification
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Server Module Syntax and Tool Count
        shell: powershell
        run: |
          python -c @"
          import ast
          with open('mcp_server/server.py', 'r', encoding='utf-8') as f:
              tree = ast.parse(f.read())
          tools = [
              n.name for n in ast.walk(tree)
              if isinstance(n, ast.FunctionDef)
              and any(getattr(d, 'attr', '') == 'tool' for d in n.decorator_list if isinstance(d, ast.Call))
          ]
          print(f'Discovered {len(tools)} tools in server.py')
          assert len(tools) == 234, f'Expected 234 tools, found {len(tools)}'
          print('Tool surface validation successful.')
          "@

      - name: Build Python Distribution Packages
        shell: powershell
        run: |
          python -m build
          Get-ChildItem dist\
