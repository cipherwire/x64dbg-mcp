name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build and Publish Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Download x64dbg SDK
        shell: powershell
        run: |
          Write-Host "Downloading x64dbg 2026 snapshot SDK..."
          $sdkUrl = "https://github.com/x64dbg/x64dbg/releases/download/2026.05.27/snapshot_2026-05-27_12-11.zip"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "x64dbg_snapshot.zip"
          Write-Host "Extracting x64dbg SDK..."
          Expand-Archive -Path "x64dbg_snapshot.zip" -DestinationPath "$env:RUNNER_TEMP\x64dbg"
          $sdkPath = "$env:RUNNER_TEMP\x64dbg\pluginsdk"
          if (-not (Test-Path $sdkPath)) {
            Write-Error "SDK directory not found at $sdkPath"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "X64DBG_SDK_DIR=$sdkPath"
          Write-Host "SDK located at $sdkPath"

      - name: Compile Native Plugins (/W4 /WX)
        shell: powershell
        run: |
          .\scripts\build.ps1 -Platform All -SdkDir $env:X64DBG_SDK_DIR

      - name: Build Python Packages
        shell: powershell
        run: |
          python -m build
          Get-ChildItem dist\

      - name: Prepare Release Bundle
        shell: powershell
        run: |
          $bundleDir = "$env:RUNNER_TEMP\bundle"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item -Path "bin\x64dbg_mcp.dp64" -Destination $bundleDir -Force
          Copy-Item -Path "bin\x32dbg_mcp.dp32" -Destination $bundleDir -Force
          Copy-Item -Path "README.md" -Destination $bundleDir -Force
          Copy-Item -Path "THIRD_PARTY_NOTICES.md" -Destination $bundleDir -Force
          
          $zipPath = "dist\x64dbg-mcp-windows-plugins.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $zipPath -Force
          Write-Host "Release bundle created: $zipPath"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/x64dbg_mcp.dp64
            bin/x32dbg_mcp.dp32
            dist/x64dbg-mcp-windows-plugins.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
